# Traditional Chinese messages. The game session error codes (REFACTOR_PLAN.md
# §1.1 "CODE_MAIN 不搬 → i18n") and the HTTP-style error codes shown on the
# generic error page are both looked up explicitly with `locale: :"zh-TW"`
# from WelcomeController#error_message_for regardless of the app's default
# locale.
zh-TW:
  errors:
    game:
      "01002": "序號不存在或角色不合法，請確認序號與角色是否正確"
      "01003": "Email 格式錯誤，請重新輸入"
      "01004": "隊伍已滿，無法加入"
    http:
      "404": "頁面不存在"
      "500": "系統錯誤"
      "403": "權限不足"
    unknown: "未知錯誤"
