# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

AllCops:
  # db/schema.rb is Rails-generated (via `db:schema:dump`) — not hand-written,
  # so it's excluded rather than made to match house style.
  Exclude:
    - "db/schema.rb"
